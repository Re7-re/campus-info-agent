# docker/docker-compose.yml
version: '3.8'

services:
  campus-agent-ui:
    build:
      context: ..
      dockerfile:  docker/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - DEFAULT_AI_SERVICE=alibaba
      - ALIBABA_API_KEY=${ALIBABA_API_KEY}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: python main.py --mode ui --port 7860

  campus-agent-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_AI_SERVICE=alibaba
      - ALIBABA_API_KEY=${ALIBABA_API_KEY}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: python main.py --mode api --port 8000